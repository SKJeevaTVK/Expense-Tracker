<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense & Budget Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; padding: 20px 10px; color: #f8fafc; }
        .container { max-width: 520px; margin: 0 auto; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: #38bdf8; font-size: 20px; text-shadow: 0 0 10px rgba(56,189,248,0.3); margin: 0; }
        
        .header-actions { display: flex; gap: 8px; }
        .btn-sm { width: auto; padding: 6px 12px; margin: 0; font-size: 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; }
        .btn-logout { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }

        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); }
        h3 { font-size: 16px; margin-bottom: 14px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; }
        
        label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; display: block; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; outline: none; background: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.4); }
        
        button { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-weight: bold; border: none; cursor: pointer; transition: all 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-nav { background: linear-gradient(135deg, #0284c7, #0369a1); font-size: 15px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-home { background: linear-gradient(135deg, #059669, #047857); margin-bottom: 15px; }
        
        .auth-toggle { text-align: center; font-size: 13px; color: #38bdf8; cursor: pointer; margin-top: 10px; text-decoration: underline; background: none; border: none; padding: 0; margin-bottom: 0; }

        .type-toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-type-debit { background: linear-gradient(135deg, #dc2626, #991b1b); border: 2px solid #ef4444; color: #fff; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; opacity: 0.6; }
        .btn-type-credit { background: linear-gradient(135deg, #16a34a, #166534); border: 2px solid #22c55e; color: #fff; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; opacity: 0.6; }
        .btn-type-debit.selected, .btn-type-credit.selected { opacity: 1; transform: scale(1.03); }

        .cat-chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .btn-cat-chip { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; margin: 0; text-align: center; }
        .btn-cat-chip.selected { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; color: #fff; }

        .step-container { display: none; }
        .step-container.active { display: block; }

        .page-view { display: none; }
        .page-view.active { display: block; }

        .overview-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .overview-box { background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .overview-box span { font-size: 10px; color: #94a3b8; display: block; }
        .overview-box strong { font-size: 14px; margin-top: 4px; display: block; }

        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .budget-card { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 12px; text-align: center; }
        .budget-status { font-weight: bold; font-size: 16px; margin: 6px 0; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }

        .progress-bg { background: #334155; height: 6px; border-radius: 3px; margin: 6px 0; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.3s ease; }

        .filter-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; }
        .amount-credit { color: #4ade80; font-weight: bold; }
        .amount-debit { color: #f87171; font-weight: bold; }
        .del-btn { background: transparent; border: none; color: #ef4444; font-size: 16px; width: auto; padding: 0 5px; margin: 0; cursor: pointer; }
        
        .chart-container { position: relative; max-width: 250px; margin: 15px auto 5px auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Budget Tracker</h2>
        <div class="header-actions">
            <button type="button" class="btn-sm btn-logout" id="btn-logout" onclick="handleLogout()" style="display:none;">Logout</button>
        </div>
    </div>

    <!-- PAGE 0: AUTHENTICATION -->
    <div id="page-auth" class="page-view active">
        <div class="card">
            <h3 id="auth-title">Login to Your Account</h3>
            <form onsubmit="handleAuthSubmit(event)">
                <input type="email" id="auth-email" placeholder="Email Address" required>
                <input type="password" id="auth-password" placeholder="Password">
                
                <button type="submit" id="btn-auth-submit">Login</button>
            </form>
            
            <button type="button" class="auth-toggle" onclick="toggleAuthMode('signup')" id="link-signup">Don't have an account? Sign Up</button>
            <button type="button" class="auth-toggle" onclick="toggleAuthMode('forgot')" id="link-forgot">Forgot Password?</button>
            <button type="button" class="auth-toggle" onclick="toggleAuthMode('login')" id="link-login" style="display:none;">Back to Login</button>
        </div>
    </div>

    <!-- PAGE 1: MAIN DASHBOARD -->
    <div id="page-dashboard" class="page-view">
        <div class="card">
            <h3>Add Entry</h3>
            
            <label>1. Select Transaction Type</label>
            <div class="type-toggle-grid">
                <button type="button" class="btn-type-debit" id="btn-debit" onclick="selectType('expense')">🔴 Debit (Expense)</button>
                <button type="button" class="btn-type-credit" id="btn-credit" onclick="selectType('income')">🟢 Credit (Income)</button>
            </div>

            <div id="step-category" class="step-container">
                <label>2. Select Category / Description</label>
                <div id="category-buttons-grid" class="cat-chip-grid"></div>
                <div id="custom-cat-container" style="display:none; margin-top:-5px;">
                    <input type="text" id="custom-cat-input" placeholder="Enter Description">
                </div>
            </div>

            <div id="step-amount" class="step-container">
                <label>3. Enter Date & Amount (₹)</label>
                <input type="date" id="entry-date">
                <input type="number" id="amount" placeholder="Amount (e.g. 500)">
                <button type="button" onclick="addTransaction()">💾 Save Transaction</button>
            </div>
        </div>

        <div class="card">
            <label>Select Month History:</label>
            <select id="month-filter-dash" onchange="syncMonthAndLoad('dash')"></select>
            
            <div class="overview-grid">
                <div class="overview-box">
                    <span>Income</span>
                    <strong style="color: #4ade80;" id="sum-income">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Expense</span>
                    <strong style="color: #f87171;" id="sum-expense">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Balance</span>
                    <strong style="color: #38bdf8;" id="sum-balance">₹0</strong>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <button type="button" class="btn-nav" onclick="showPage('page-history')">📜 View Detailed History Page</button>
        <button type="button" class="btn-nav" onclick="showPage('page-categories')">🏷️ Manage Category Allowances Page</button>
    </div>
        <!-- PAGE 2: HISTORY PAGE -->
    <div id="page-history" class="page-view">
        <button type="button" class="btn-home" onclick="showPage('page-dashboard')">🏠 Go to Dashboard</button>

        <div class="card">
            <label>Select Month History:</label>
            <select id="month-filter-hist" onchange="syncMonthAndLoad('hist')"></select>
        </div>

        <div class="card">
            <h3>Transaction History</h3>
            <input type="text" id="search-input" placeholder="🔍 Search Category or Amount..." onkeyup="renderHistory()" style="margin-bottom: 10px;">

            <div class="filter-group">
                <div>
                    <label>Type Filter</label>
                    <select id="filter-type" onchange="renderHistory()">
                        <option value="all">All Transactions</option>
                        <option value="income">Credit Only</option>
                        <option value="expense">Debit Only</option>
                    </select>
                </div>
                <div>
                    <label>Category Filter</label>
                    <select id="filter-category" onchange="renderHistory()"></select>
                </div>
            </div>
            <div id="transaction-list">Loading...</div>
        </div>
    </div>

    <!-- PAGE 3: CATEGORY ALLOWANCES PAGE -->
    <div id="page-categories" class="page-view">
        <button type="button" class="btn-home" onclick="showPage('page-dashboard')">🏠 Go to Dashboard</button>

        <div class="card">
            <h3>Total Monthly Allowance Overview</h3>
            <div class="overview-grid">
                <div class="overview-box">
                    <span>Limit</span>
                    <strong style="color: #38bdf8;" id="tot-budget-limit">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Spent</span>
                    <strong style="color: #f87171;" id="tot-budget-spent">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Left</span>
                    <strong style="color: #4ade80;" id="tot-budget-left">₹0</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Category Allowances & Balances</h3>
            <div id="budget-list" class="category-grid">Loading Budgets...</div>
        </div>

        <div class="card">
            <h3>Add New Allowance Category</h3>
            <label>Category Name</label>
            <input type="text" id="new-cat-name" placeholder="Name (e.g. Snacks)">
            <label>Monthly Limit (₹)</label>
            <input type="number" id="new-cat-limit" placeholder="Monthly Limit (e.g. 1000)">
            <button type="button" onclick="addCategory()">+ Add Category</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ PASTE YOUR EXACT SUPABASE URL AND KEY HERE
    const SUPABASE_URL = 'https://rjinxqbqiypcimtthcbv.supabase.co/rest/v1/'; 
    const SUPABASE_KEY = 'sb_publishable_cOp1rCjsTMyShJRMitbsng_jkxpmJ2m'; 
    
    let db = null;
    try {
        db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
        console.error("Supabase config error:", e);
    }

    let authMode = 'login';
    let currentUser = null;
    let categories = [];
    let currentTransactions = [];
    let selectedMonth = '';
    let selectedType = null;
    let selectedCategory = null;
    let chartInstance = null;

    async function checkUserSession() {
        if (!db) return;
        try {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('btn-logout').style.display = 'block';
                showPage('page-dashboard');
                initMonthDropdowns();
                await loadCategories();
                loadDashboard();
            } else {
                document.getElementById('btn-logout').style.display = 'none';
                showPage('page-auth');
            }
        } catch(e) {
            console.error(e);
        }
    }

    function toggleAuthMode(mode) {
        authMode = mode;
        const passwordInput = document.getElementById('auth-password');
        const submitBtn = document.getElementById('btn-auth-submit');
        const title = document.getElementById('auth-title');

        document.getElementById('link-signup').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('link-forgot').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('link-login').style.display = mode !== 'login' ? 'block' : 'none';

        if (mode === 'login') {
            title.innerText = 'Login to Your Account';
            submitBtn.innerText = 'Login';
            passwordInput.style.display = 'block';
            passwordInput.required = true;
        } else if (mode === 'signup') {
            title.innerText = 'Create New Account';
            submitBtn.innerText = 'Sign Up';
            passwordInput.style.display = 'block';
            passwordInput.required = true;
        } else if (mode === 'forgot') {
            title.innerText = 'Reset Password via Email';
            submitBtn.innerText = 'Send Reset Link';
            passwordInput.style.display = 'none';
            passwordInput.required = false;
        }
    }

    async function handleAuthSubmit(event) {
        if (event) event.preventDefault();
        
        if (SUPABASE_URL === 'YOUR_SUPABASE_URL' || !SUPABASE_URL) {
            return alert('Error: Please replace YOUR_SUPABASE_URL with your actual Supabase URL!');
        }

        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;

        if (!email) return alert('Please enter Email Address!');

        try {
            if (authMode === 'login') {
                const { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) return alert(error.message);
                checkUserSession();
            } else if (authMode === 'signup') {
                const { data, error } = await db.auth.signUp({ email, password });
                if (error) return alert(error.message);
                alert('Account created! Verification link sent to your Email.');
                toggleAuthMode('login');
            } else if (authMode === 'forgot') {
                const { error } = await db.auth.resetPasswordForEmail(email);
                if (error) return alert(error.message);
                alert('Password Reset Link has been sent to your Email!');
                toggleAuthMode('login');
            }
        } catch(err) {
            alert("Error: " + err.message);
        }
    }

    async function handleLogout() {
        if (db) await db.auth.signOut();
        currentUser = null;
        checkUserSession();
    }

    function showPage(pageId) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0,0);
    }

    function initMonthDropdowns() {
        const dashSelect = document.getElementById('month-filter-dash');
        const histSelect = document.getElementById('month-filter-hist');
        dashSelect.innerHTML = '';
        histSelect.innerHTML = '';

        const currentDate = new Date();
        for (let i = 0; i < 12; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
            const monthVal = date.toISOString().slice(0, 7);
            const monthText = date.toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const opt1 = document.createElement('option');
            opt1.value = monthVal; opt1.innerText = monthText;
            dashSelect.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = monthVal; opt2.innerText = monthText;
            histSelect.appendChild(opt2);
        }
        selectedMonth = dashSelect.value;
        document.getElementById('entry-date').valueAsDate = new Date();
    }

    function syncMonthAndLoad(source) {
        if (source === 'dash') {
            selectedMonth = document.getElementById('month-filter-dash').value;
            document.getElementById('month-filter-hist').value = selectedMonth;
        } else {
            selectedMonth = document.getElementById('month-filter-hist').value;
            document.getElementById('month-filter-dash').value = selectedMonth;
        }
        loadDashboard();
    }

    async function loadCategories() {
        const { data } = await db.from('category_budgets').select('*').eq('is_active', true);
        categories = data || [];
        
        const catFilter = document.getElementById('filter-category');
        catFilter.innerHTML = `<option value="all">All Categories</option>`;
        categories.forEach(c => {
            catFilter.innerHTML += `<option value="${c.category_name}">${c.category_name}</option>`;
        });
    }

    function selectType(type) {
        selectedType = type;
        selectedCategory = null;

        document.getElementById('btn-debit').classList.toggle('selected', type === 'expense');
        document.getElementById('btn-credit').classList.toggle('selected', type === 'income');

        const catGrid = document.getElementById('category-buttons-grid');
        catGrid.innerHTML = '';
        document.getElementById('custom-cat-container').style.display = 'none';

        if (type === 'expense') {
            categories.forEach(c => {
                catGrid.innerHTML += `<button type="button" class="btn-cat-chip" onclick="selectCategory('${c.category_name}', this)">${c.category_name}</button>`;
            });
        } else {
            const incomeSources = ['Salary', 'Bonus', 'Freelance', 'Cashback', 'Other Income'];
            incomeSources.forEach(src => {
                catGrid.innerHTML += `<button type="button" class="btn-cat-chip" onclick="selectCategory('${src}', this)">${src}</button>`;
            });
        }

        document.getElementById('step-category').classList.add('active');
        document.getElementById('step-amount').classList.remove('active');
    }

    function selectCategory(catName, btnElement) {
        selectedCategory = catName;
        document.querySelectorAll('.btn-cat-chip').forEach(b => b.classList.remove('selected'));
        if (btnElement) btnElement.classList.add('selected');

        if (catName === 'Other Income') {
            document.getElementById('custom-cat-container').style.display = 'block';
        } else {
            document.getElementById('custom-cat-container').style.display = 'none';
        }

        document.getElementById('step-amount').classList.add('active');
    }

    async function addTransaction() {
        let category = selectedCategory;
        if (category === 'Other Income') {
            category = document.getElementById('custom-cat-input').value || 'Other Income';
        }

        const amount = parseFloat(document.getElementById('amount').value);
        const entryDate = document.getElementById('entry-date').value;

        if (!amount || !category || !entryDate) return alert('Enter valid Date, Category and Amount!');

        await db.from('transactions').insert([{ 
            type: selectedType, 
            category: category, 
            amount: amount, 
            created_at: new Date(entryDate).toISOString(),
            user_id: currentUser.id
        }]);
        
        document.getElementById('amount').value = '';
        document.getElementById('step-category').classList.remove('active');
        document.getElementById('step-amount').classList.remove('active');
        loadDashboard();
        alert('Transaction saved successfully!');
    }

    async function addCategory() {
        const name = document.getElementById('new-cat-name').value;
        const limit = parseFloat(document.getElementById('new-cat-limit').value);
        if(!name || !limit) return alert("Enter Category Name & Limit!");

        await db.from('category_budgets').insert([{ 
            category_name: name, 
            monthly_limit: limit, 
            is_active: true,
            user_id: currentUser.id
        }]);

        document.getElementById('new-cat-name').value = '';
        document.getElementById('new-cat-limit').value = '';
        await loadCategories();
        loadDashboard();
    }

    async function deleteTransaction(id) {
        if(confirm("Delete this entry?")) {
            await db.from('transactions').delete().eq('id', id);
            loadDashboard();
        }
    }

    async function loadDashboard() {
        const startDate = `${selectedMonth}-01T00:00:00.000Z`;
        const endDate = new Date(selectedMonth.split('-')[0], selectedMonth.split('-')[1], 0, 23, 59, 59).toISOString();

        const { data: transactions } = await db.from('transactions').select('*').gte('created_at', startDate).lte('created_at', endDate).order('created_at', { ascending: false });
        currentTransactions = transactions || [];

        let totIncome = currentTransactions.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount), 0);
        let totExpense = currentTransactions.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        
        document.getElementById('sum-income').innerText = `₹${totIncome}`;
        document.getElementById('sum-expense').innerText = `₹${totExpense}`;
        document.getElementById('sum-balance').innerText = `₹${totIncome - totExpense}`;

        let overallLimit = categories.reduce((sum, c) => sum + parseFloat(c.monthly_limit), 0);
        let overallSpent = 0;

        const budgetContainer = document.getElementById('budget-list');
        budgetContainer.innerHTML = '';

        let chartLabels = [];
        let chartData = [];

        categories.forEach(c => {
            const catExpenses = currentTransactions
                .filter(t => t.category === c.category_name && t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            overallSpent += catExpenses;
            if(catExpenses > 0) {
                chartLabels.push(c.category_name);
                chartData.push(catExpenses);
            }

            const remBalance = c.monthly_limit - catExpenses;
            let pct = Math.min(100, Math.round((catExpenses / c.monthly_limit) * 100)) || 0;
            let barColor = pct > 90 ? '#ef4444' : (pct > 70 ? '#f59e0b' : '#10b981');

            budgetContainer.innerHTML += `
                <div class="budget-card">
                    <strong>${c.category_name}</strong>
                    <span>Limit: ₹${c.monthly_limit}</span>
                    <div class="budget-status ${remBalance >= 0 ? 'positive' : 'negative'}">₹${remBalance}</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: ${pct}%; background: ${barColor};"></div></div>
                    <span>Spent: ₹${catExpenses} (${pct}%)</span>
                </div>
            `;
        });

        document.getElementById('tot-budget-limit').innerText = `₹${overallLimit}`;
        document.getElementById('tot-budget-spent').innerText = `₹${overallSpent}`;
        document.getElementById('tot-budget-left').innerText = `₹${overallLimit - overallSpent}`;

        renderChart(chartLabels, chartData);
        renderHistory();
    }

    function renderChart(labels, data) {
        const ctx = document.getElementById('expenseChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        if (data.length === 0) return;

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels, datasets: [{ data, backgroundColor: ['#ef4444', '#38bdf8', '#f59e0b', '#10b981', '#a78bfa'] }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 10 } } } } }
        });
    }

    function renderHistory() {
        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        const listContainer = document.getElementById('transaction-list');
        
        let filtered = currentTransactions.filter(t => t.category.toLowerCase().includes(searchQuery) || t.amount.toString().includes(searchQuery));

        listContainer.innerHTML = '';
        if (filtered.length === 0) {
            listContainer.innerHTML = `<p style="color:#64748b; text-align:center; padding:10px;">No matching entries found.</p>`;
            return;
        }

        filtered.forEach(t => {
            const isCredit = t.type === 'income';
            listContainer.innerHTML += `
                <div class="list-item">
                    <div>
                        <strong>${t.category}</strong><br>
                        <span>${new Date(t.created_at).toLocaleDateString()}</span>
                    </div>
                    <div>
                        <strong class="${isCredit ? 'amount-credit' : 'amount-debit'}">${isCredit ? '+' : '-'}₹${t.amount}</strong>
                        <button type="button" class="del-btn" onclick="deleteTransaction(${t.id})">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    checkUserSession();
