<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense & Budget Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; padding: 20px 10px; color: #f8fafc; }
        .container { max-width: 520px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 24px; text-shadow: 0 0 10px rgba(56,189,248,0.3); }
        
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); }
        h3 { font-size: 16px; margin-bottom: 14px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; }
        
        label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; display: block; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; outline: none; background: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.4); }
        
        button { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-weight: bold; border: none; cursor: pointer; transition: all 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-nav { background: linear-gradient(135deg, #0284c7, #0369a1); font-size: 15px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-home { background: linear-gradient(135deg, #059669, #047857); margin-bottom: 15px; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-edit { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-export { background: linear-gradient(135deg, #10b981, #059669); margin-top: 10px; }
        
        /* Creative Step Flow & Buttons */
        .type-toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .btn-type-debit { background: linear-gradient(135deg, #dc2626, #991b1b); border: 2px solid #ef4444; color: #fff; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; opacity: 0.6; transition: all 0.3s ease; }
        .btn-type-credit { background: linear-gradient(135deg, #16a34a, #166534); border: 2px solid #22c55e; color: #fff; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 15px; opacity: 0.6; transition: all 0.3s ease; }
        .btn-type-debit.selected, .btn-type-credit.selected { opacity: 1; transform: scale(1.03); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .btn-type-debit.selected { border-color: #f87171; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .btn-type-credit.selected { border-color: #4ade80; box-shadow: 0 0 15px rgba(34, 197, 94, 0.5); }

        .cat-chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 15px; }
        .btn-cat-chip { background: #1e293b; border: 1px solid #475569; color: #cbd5e1; padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 600; margin: 0; text-align: center; }
        .btn-cat-chip.selected { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; color: #fff; box-shadow: 0 0 10px rgba(56,189,248,0.4); }

        .step-container { display: none; }
        .step-container.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Page Views Navigation */
        .page-view { display: none; }
        .page-view.active { display: block; }

        /* Overview Grid */
        .overview-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .overview-box { background: rgba(15, 23, 42, 0.6); padding: 10px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .overview-box span { font-size: 10px; color: #94a3b8; display: block; text-transform: uppercase; }
        .overview-box strong { font-size: 14px; margin-top: 4px; display: block; }

        /* Category Grid Cards */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .budget-card { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 12px; text-align: center; position: relative; overflow: hidden; }
        .budget-card strong { font-size: 14px; color: #f8fafc; display: block; }
        .budget-card span { font-size: 11px; color: #64748b; }
        .budget-status { font-weight: bold; font-size: 16px; margin: 6px 0; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .cat-actions { display: flex; gap: 5px; margin-top: 8px; }
        .cat-actions button { padding: 4px; font-size: 10px; margin: 0; }

        /* Progress Bar */
        .progress-bg { background: #334155; height: 6px; border-radius: 3px; margin: 6px 0; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.3s ease; }

        /* Filter Controls */
        .filter-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        /* Transaction Item */
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; }
        .list-item span { font-size: 11px; color: #64748b; }
        .amount-credit { color: #4ade80; font-weight: bold; }
        .amount-debit { color: #f87171; font-weight: bold; }
        .del-btn { background: transparent; border: none; color: #ef4444; font-size: 16px; width: auto; padding: 0 5px; margin: 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Budget & Expense Tracker</h2>

    <!-- ================= PAGE 1: MAIN DASHBOARD ================= -->
    <div id="page-dashboard" class="page-view active">
        <!-- 1. CREATIVE DYNAMIC ADD ENTRY FORM -->
        <div class="card">
            <h3>Add Entry</h3>
            
            <!-- STEP 1: TRANSACTION TYPE BUTTONS -->
            <label>1. Select Transaction Type</label>
            <div class="type-toggle-grid">
                <button type="button" class="btn-type-debit" id="btn-debit" onclick="selectType('expense')">🔴 Debit (Expense)</button>
                <button type="button" class="btn-type-credit" id="btn-credit" onclick="selectType('income')">🟢 Credit (Income)</button>
            </div>

            <!-- STEP 2: CATEGORY SELECTION BUTTONS (Hidden until Type selected) -->
            <div id="step-category" class="step-container">
                <label>2. Select Category / Description</label>
                <div id="category-buttons-grid" class="cat-chip-grid"></div>
                <div id="custom-cat-container" style="display:none; margin-top:-5px;">
                    <input type="text" id="custom-cat-input" placeholder="Enter Custom Income Description">
                </div>
            </div>

            <!-- STEP 3: AMOUNT & SAVE (Hidden until Category selected) -->
            <div id="step-amount" class="step-container">
                <label>3. Enter Amount</label>
                <input type="number" id="amount" placeholder="Amount (e.g. 500)">
                <button onclick="addTransaction()">💾 Save Transaction</button>
            </div>
        </div>

        <!-- 2. SELECT MONTH HISTORY & OVERVIEW -->
        <div class="card">
            <label>Select Month History:</label>
            <select id="month-filter-dash" onchange="syncMonthAndLoad('dash')"></select>
            
            <div class="overview-grid">
                <div class="overview-box">
                    <span>Income</span>
                    <strong style="color: #4ade80;" id="sum-income">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Expense</span>
                    <strong style="color: #f87171;" id="sum-expense">₹0</strong>
                </div>
                <div class="overview-box">
                    <span>Balance</span>
                    <strong style="color: #38bdf8;" id="sum-balance">₹0</strong>
                </div>
            </div>
        </div>

        <!-- NAVIGATION BUTTONS -->
        <button class="btn-nav" onclick="showPage('page-history')">📜 View Detailed History Page</button>
        <button class="btn-nav" onclick="showPage('page-categories')">🏷️ Manage Category Allowances Page</button>
    </div>

    <!-- ================= PAGE 2: HISTORY PAGE ================= -->
    <div id="page-history" class="page-view">
        <button class="btn-home" onclick="showPage('page-dashboard')">🏠 Go to Dashboard</button>

        <!-- MONTH SELECTION -->
        <div class="card">
            <label>Select Month History:</label>
            <select id="month-filter-hist" onchange="syncMonthAndLoad('hist')"></select>
        </div>

        <!-- HISTORY LIST -->
        <div class="card">
            <h3>Transaction History</h3>
            <div class="filter-group">
                <div>
                    <label>Type Filter</label>
                    <select id="filter-type" onchange="renderHistory()">
                        <option value="all">All Transactions</option>
                        <option value="income">Credit (Income) Only</option>
                        <option value="expense">Debit (Expense) Only</option>
                    </select>
                </div>
                <div>
                    <label>Category Filter</label>
                    <select id="filter-category" onchange="renderHistory()"></select>
                </div>
            </div>
            <div id="transaction-list">Loading...</div>
            <button class="btn-export" onclick="exportToCSV()">📥 Download Excel / CSV History</button>
        </div>
    </div>

    <!-- ================= PAGE 3: CATEGORY ALLOWANCES PAGE ================= -->
    <div id="page-categories" class="page-view">
        <button class="btn-home" onclick="showPage('page-dashboard')">🏠 Go to Dashboard</button>

        <!-- CATEGORY ALLOWANCES GRID -->
        <div class="card">
            <h3>Category Allowances & Balances</h3>
            <div id="budget-list" class="category-grid">Loading Budgets...</div>
        </div>

        <!-- ADD CATEGORY FORM -->
        <div class="card">
            <h3>Add New Allowance Category</h3>
            <label>Category Name</label>
            <input type="text" id="new-cat-name" placeholder="Name (e.g. Theatre)">
            <label>Monthly Limit</label>
            <input type="number" id="new-cat-limit" placeholder="Monthly Limit (e.g. 500)">
            <button onclick="addCategory()">+ Add Category</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ PASTE YOUR SUPABASE DETAILS HERE
    const SUPABASE_URL = 'https://rjinxqbqiypcimtthcbv.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_cOp1rCjsTMyShJRMitbsng_jkxpmJ2m'; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categories = [];
    let currentTransactions = [];
    let selectedMonth = '';

    // Active Selection States for Add Entry Step Flow
    let selectedType = null;
    let selectedCategory = null;

    function showPage(pageId) {
        document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0,0);
    }

    function initMonthDropdowns() {
        const dashSelect = document.getElementById('month-filter-dash');
        const histSelect = document.getElementById('month-filter-hist');
        dashSelect.innerHTML = '';
        histSelect.innerHTML = '';

        const currentDate = new Date();
        for (let i = 0; i < 12; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
            const monthVal = date.toISOString().slice(0, 7);
            const monthText = date.toLocaleString('default', { month: 'long', year: 'numeric' });
            
            const opt1 = document.createElement('option');
            opt1.value = monthVal; opt1.innerText = monthText;
            dashSelect.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = monthVal; opt2.innerText = monthText;
            histSelect.appendChild(opt2);
        }
        selectedMonth = dashSelect.value;
    }

    function syncMonthAndLoad(source) {
        if (source === 'dash') {
            selectedMonth = document.getElementById('month-filter-dash').value;
            document.getElementById('month-filter-hist').value = selectedMonth;
        } else {
            selectedMonth = document.getElementById('month-filter-hist').value;
            document.getElementById('month-filter-dash').value = selectedMonth;
        }
        loadDashboard();
    }

    async function loadCategories() {
        const { data } = await db.from('category_budgets').select('*').eq('is_active', true);
        categories = data || [];
        
        const catFilter = document.getElementById('filter-category');
        catFilter.innerHTML = '<option value="all">All Categories</option>';
        categories.forEach(c => {
            catFilter.innerHTML += `<option value="${c.category_name}">${c.category_name}</option>`;
        });
    }

    /* STEP FLOW LOGIC */
    function selectType(type) {
        selectedType = type;
        selectedCategory = null;

        document.getElementById('btn-debit').classList.toggle('selected', type === 'expense');
        document.getElementById('btn-credit').classList.toggle('selected', type === 'income');

        const catGrid = document.getElementById('category-buttons-grid');
        catGrid.innerHTML = '';
        document.getElementById('custom-cat-container').style.display = 'none';

        if (type === 'expense') {
            categories.forEach(c => {
                catGrid.innerHTML += `<button type="button" class="btn-cat-chip" onclick="selectCategory('${c.category_name}', this)">${c.category_name}</button>`;
            });
        } else {
            const incomeSources = ['Salary', 'Bonus', 'Freelance', 'Cashback', 'Other Income'];
            incomeSources.forEach(src => {
                catGrid.innerHTML += `<button type="button" class="btn-cat-chip" onclick="selectCategory('${src}', this)">${src}</button>`;
            });
        }

        document.getElementById('step-category').classList.add('active');
        document.getElementById('step-amount').classList.remove('active');
    }

    function selectCategory(catName, btnElement) {
        selectedCategory = catName;

        document.querySelectorAll('.btn-cat-chip').forEach(b => b.classList.remove('selected'));
        if (btnElement) btnElement.classList.add('selected');

        if (catName === 'Other Income') {
            document.getElementById('custom-cat-container').style.display = 'block';
        } else {
            document.getElementById('custom-cat-container').style.display = 'none';
        }

        document.getElementById('step-amount').classList.add('active');
    }

    function resetEntryForm() {
        selectedType = null;
        selectedCategory = null;
        document.getElementById('btn-debit').classList.remove('selected');
        document.getElementById('btn-credit').classList.remove('selected');
        document.getElementById('step-category').classList.remove('active');
        document.getElementById('step-amount').classList.remove('active');
        document.getElementById('amount').value = '';
        document.getElementById('custom-cat-input').value = '';
    }

    async function addTransaction() {
        if (!selectedType) return alert('Select Transaction Type first!');
        
        let category = selectedCategory;
        if (category === 'Other Income') {
            category = document.getElementById('custom-cat-input').value || 'Other Income';
        }

        const amount = parseFloat(document.getElementById('amount').value);

        if (!amount || !category) return alert('Enter valid Category and Amount!');

        await db.from('transactions').insert([{ type: selectedType, category: category, amount: amount }]);
        
        resetEntryForm();
        loadDashboard();
        alert('Transaction saved successfully!');
    }

    async function addCategory() {
        const name = document.getElementById('new-cat-name').value;
        const limit = parseFloat(document.getElementById('new-cat-limit').value);
        if(!name || !limit) return alert("Category Name and Limit Enter Pannunga!");

        await db.from('category_budgets').upsert([{ category_name: name, monthly_limit: limit, is_active: true }], { onConflict: 'category_name' });
        document.getElementById('new-cat-name').value = '';
        document.getElementById('new-cat-limit').value = '';
        await loadCategories();
        loadDashboard();
        alert('Category added successfully!');
    }

    async function updateLimit(catName, currentLimit) {
        const newLimit = prompt(`Update Monthly Budget Limit for ${catName}:`, currentLimit);
        if (newLimit !== null && !isNaN(newLimit) && confirm(`Confirm to change limit for ${catName} to ₹${newLimit}?`)) {
            await db.from('category_budgets').update({ monthly_limit: parseFloat(newLimit) }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function removeCategory(catName) {
        if(confirm(`Remove "${catName}" category? (Previous transaction data will stay safe)`)) {
            await db.from('category_budgets').update({ is_active: false }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function deleteTransaction(id) {
        if(confirm("Are you sure you want to delete this transaction entry?")) {
            await db.from('transactions').delete().eq('id', id);
            loadDashboard();
        }
    }

    async function loadDashboard() {
        const startDate = `${selectedMonth}-01T00:00:00.000Z`;
        const endDate = new Date(selectedMonth.split('-')[0], selectedMonth.split('-')[1], 0, 23, 59, 59).toISOString();

        const { data: transactions } = await db.from('transactions').select('*').gte('created_at', startDate).lte('created_at', endDate).order('created_at', { ascending: false });
        currentTransactions = transactions || [];

        // Summary Calculations
        let totIncome = currentTransactions.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount), 0);
        let totExpense = currentTransactions.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
        
        document.getElementById('sum-income').innerText = `₹${totIncome}`;
        document.getElementById('sum-expense').innerText = `₹${totExpense}`;
        document.getElementById('sum-balance').innerText = `₹${totIncome - totExpense}`;

        // Budget Calculations & Progress Bars
        const budgetContainer = document.getElementById('budget-list');
        budgetContainer.innerHTML = '';

        categories.forEach(c => {
            const catExpenses = currentTransactions
                .filter(t => t.category === c.category_name && t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            const remBalance = c.monthly_limit - catExpenses;
            const statusClass = remBalance >= 0 ? 'positive' : 'negative';
            
            let pct = Math.min(100, Math.round((catExpenses / c.monthly_limit) * 100)) || 0;
            let barColor = pct > 90 ? '#ef4444' : (pct > 70 ? '#f59e0b' : '#10b981');

            budgetContainer.innerHTML += `
                <div class="budget-card">
                    <strong>${c.category_name}</strong>
                    <span>Limit: ₹${c.monthly_limit}</span>
                    <div class="budget-status ${statusClass}">₹${remBalance}</div>
                    
                    <div class="progress-bg">
                        <div class="progress-fill" style="width: ${pct}%; background: ${barColor};"></div>
                    </div>
                    <span>Spent: ₹${catExpenses} (${pct}%)</span>

                    <div class="cat-actions">
                        <button class="btn-edit" onclick="updateLimit('${c.category_name}', ${c.monthly_limit})">Edit</button>
                        <button class="btn-danger" onclick="removeCategory('${c.category_name}')">Remove</button>
                    </div>
                </div>
            `;
        });

        renderHistory();
    }

    function renderHistory() {
        const typeFilter = document.getElementById('filter-type').value;
        const catFilter = document.getElementById('filter-category').value;
        const listContainer = document.getElementById('transaction-list');
        
        let filtered = currentTransactions.filter(t => {
            let matchType = typeFilter === 'all' || t.type === typeFilter;
            let matchCat = catFilter === 'all' || t.category === catFilter;
            return matchType && matchCat;
        });

        listContainer.innerHTML = '';
        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="color:#64748b; text-align:center; padding:10px;">No matching transactions found.</p>';
            return;
        }

        filtered.forEach(t => {
            const isCredit = t.type === 'income';
            listContainer.innerHTML += `
                <div class="list-item">
                    <div>
                        <strong>${t.category}</strong><br>
                        <span>${new Date(t.created_at).toLocaleDateString()}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <strong class="${isCredit ? 'amount-credit' : 'amount-debit'}">
                            ${isCredit ? '+' : '-'}₹${t.amount}
                        </strong>
                        <button class="del-btn" onclick="deleteTransaction(${t.id})" title="Delete Entry">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function exportToCSV() {
        if(currentTransactions.length === 0) return alert('No transactions to export!');
        let csvContent = "data:text/csv;charset=utf-8,Date,Type,Category,Amount\n";
        currentTransactions.forEach(t => {
            csvContent += `${new Date(t.created_at).toLocaleDateString()},${t.type},${t.category},${t.amount}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Transactions_${selectedMonth}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    initMonthDropdowns();
    loadCategories().then(() => loadDashboard());
</script>

</body>
</html>
