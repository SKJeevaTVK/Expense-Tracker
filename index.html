<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Budget & Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f1f5f9; padding: 15px; color: #1e293b; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 15px; color: #0f172a; }
        
        .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { font-size: 15px; margin-bottom: 10px; color: #334155; }
        
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        button.btn-danger { background: #dc2626; }
        
        /* Category Budget Cards */
        .budget-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; }
        .budget-info strong { display: block; font-size: 14px; }
        .budget-info span { font-size: 11px; color: #64748b; }
        .budget-status { text-align: right; font-weight: bold; font-size: 14px; }
        .positive { color: #16a34a; }
        .negative { color: #dc2626; }
        
        .list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .list-item span { font-size: 11px; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Budget & Expense Tracker</h2>
    
    <!-- Month Filter -->
    <div class="card">
        <label>Select Month History:</label>
        <select id="month-filter" onchange="loadDashboard()"></select>
    </div>

    <!-- Category Budget Allowances -->
    <div class="card">
        <h3>Category Allowances & Balances</h3>
        <div id="budget-list">Loading Budgets...</div>
        <hr style="margin: 10px 0;">
        <h4>Add / Manage Category</h4>
        <input type="text" id="new-cat-name" placeholder="Category Name (e.g. Theatre)">
        <input type="number" id="new-cat-limit" placeholder="Monthly Limit (e.g. 500)">
        <button onclick="addCategory()">Add Category</button>
    </div>

    <!-- Add Transaction -->
    <div class="card">
        <h3>Add Expense / Income</h3>
        <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
        <select id="category-dropdown"></select>
        <input type="number" id="amount" placeholder="Amount (e.g. 450)">
        <button onclick="addTransaction()">Save Entry</button>
    </div>

    <!-- History -->
    <div class="card">
        <h3>History</h3>
        <div id="transaction-list">Loading...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://rjinxqbqiypcimtthcbv.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_cOp1rCjsTMyShJRMitbsng_jkxpmJ2m'; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categories = [];

    function initMonthDropdown() {
        const select = document.getElementById('month-filter');
        const currentDate = new Date();
        for (let i = 0; i < 12; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
            const monthVal = date.toISOString().slice(0, 7);
            const monthText = date.toLocaleString('default', { month: 'long', year: 'numeric' });
            const opt = document.createElement('option');
            opt.value = monthVal; opt.innerText = monthText;
            select.appendChild(opt);
        }
    }

    async function loadCategories() {
        const { data } = await db.from('category_budgets').select('*').eq('is_active', true);
        categories = data || [];
        
        const dropdown = document.getElementById('category-dropdown');
        dropdown.innerHTML = '';
        categories.forEach(c => {
            dropdown.innerHTML += `<option value="${c.category_name}">${c.category_name}</option>`;
        });
    }

    async function addCategory() {
        const name = document.getElementById('new-cat-name').value;
        const limit = parseFloat(document.getElementById('new-cat-limit').value);
        if(!name || !limit) return alert("Category Name and Limit Enter Pannunga!");

        await db.from('category_budgets').upsert([{ category_name: name, monthly_limit: limit, is_active: true }], { onConflict: 'category_name' });
        document.getElementById('new-cat-name').value = '';
        document.getElementById('new-cat-limit').value = '';
        await loadCategories();
        loadDashboard();
    }

    async function updateLimit(catName, currentLimit) {
        const newLimit = prompt(`Update Monthly Budget Limit for ${catName}:`, currentLimit);
        if (newLimit !== null && !isNaN(newLimit) && confirm(`Confirm to change limit for ${catName} to ₹${newLimit}?`)) {
            await db.from('category_budgets').update({ monthly_limit: parseFloat(newLimit) }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function removeCategory(catName) {
        if(confirm(`Remove "${catName}" category? (Previous month transaction data will stay safe)`)) {
            await db.from('category_budgets').update({ is_active: false }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function loadDashboard() {
        const selectedMonth = document.getElementById('month-filter').value;
        const startDate = `${selectedMonth}-01T00:00:00.000Z`;
        const endDate = new Date(selectedMonth.split('-')[0], selectedMonth.split('-')[1], 0, 23, 59, 59).toISOString();

        // Fetch transactions for selected month
        const { data: transactions } = await db.from('transactions').select('*').gte('created_at', startDate).lte('created_at', endDate);

        // Calculate Category Balances
        const budgetContainer = document.getElementById('budget-list');
        budgetContainer.innerHTML = '';

        categories.forEach(c => {
            const catExpenses = transactions
                .filter(t => t.category === c.category_name && t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            const catIncome = transactions
                .filter(t => t.category === c.category_name && t.type === 'income')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            const remBalance = (c.monthly_limit + catIncome) - catExpenses;
            const statusClass = remBalance >= 0 ? 'positive' : 'negative';

            budgetContainer.innerHTML += `
                <div class="budget-card">
                    <div class="budget-info">
                        <strong>${c.category_name}</strong>
                        <span>Limit: ₹${c.monthly_limit} | Spent: ₹${catExpenses}</span>
                    </div>
                    <div>
                        <div class="budget-status ${statusClass}">₹${remBalance}</div>
                        <button style="padding:2px 5px; font-size:10px; width:auto;" onclick="updateLimit('${c.category_name}', ${c.monthly_limit})">Edit</button>
                        <button style="padding:2px 5px; font-size:10px; width:auto;" class="btn-danger" onclick="removeCategory('${c.category_name}')">Remove</button>
                    </div>
                </div>
            `;
        });

        // Load History
        const listContainer = document.getElementById('transaction-list');
        listContainer.innerHTML = '';
        (transactions || []).forEach(t => {
            listContainer.innerHTML += `
                <div class="list-item">
                    <div>
                        <strong>${t.category}</strong><br>
                        <span>${new Date(t.created_at).toLocaleDateString()}</span>
                    </div>
                    <strong style="color: ${t.type === 'income' ? 'green' : 'red'};">
                        ${t.type === 'income' ? '+' : '-'}₹${t.amount}
                    </strong>
                </div>
            `;
        });
    }

    async function addTransaction() {
        const type = document.getElementById('type').value;
        const category = document.getElementById('category-dropdown').value;
        const amount = parseFloat(document.getElementById('amount').value);

        if(!amount) return alert('Enter amount!');

        await db.from('transactions').insert([{ type, category, amount }]);
        document.getElementById('amount').value = '';
        loadDashboard();
    }

    initMonthDropdown();
    loadCategories().then(() => loadDashboard());
</script>

</body>
</html>
