<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>
    <!-- Supabase JS CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.full { grid-column: span 2; text-align: center; background: #2563eb; color: #fff; }
        .card h4 { font-size: 12px; text-transform: uppercase; opacity: 0.8; margin-bottom: 5px; }
        .card p { font-size: 20px; font-weight: bold; }
        .income { color: #16a34a; }
        .expense { color: #dc2626; }
        
        .form-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-card h3 { margin-bottom: 10px; font-size: 16px; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        
        .history { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .history h3 { margin-bottom: 10px; font-size: 16px; }
        .list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .list-item:last-child { border-bottom: none; }
        .item-details span { display: block; font-size: 12px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Expense Tracker</h2>
    
    <div class="card-grid">
        <div class="card full">
            <h4>Current Balance</h4>
            <p id="balance">₹0</p>
        </div>
        <div class="card">
            <h4>Income</h4>
            <p id="income" class="income">₹0</p>
        </div>
        <div class="card">
            <h4>Expense</h4>
            <p id="expense" class="expense">₹0</p>
        </div>
    </div>

    <div class="form-card">
        <h3>Add Entry (Test)</h3>
        <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
        <input type="number" id="amount" placeholder="Amount (e.g. 500)">
        <input type="text" id="category" placeholder="Category (e.g. Food, Travel)">
        <button onclick="addTransaction()">Save Entry</button>
    </div>

    <div class="history">
        <h3>Recent Transactions</h3>
        <div id="transaction-list">Loading...</div>
    </div>
</div>

<script>
    // Supabase Configuration - Unga keys-ai replacement pannunga
    const SUPABASE_URL = 'https://rjinxqbqiypcimtthcbv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cOp1rCjsTMyShJRMitbsng_jkxpmJ2m';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Load Data from Supabase
    async function fetchTransactions() {
        const { data, error } = await db
            .from('transactions')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Error fetching data:', error);
            document.getElementById('transaction-list').innerText = 'Data load aagala! Check Supabase config.';
            return;
        }

        updateUI(data);
    }

    // Add New Entry to Supabase Database
    async function addTransaction() {
        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const category = document.getElementById('category').value;

        if (!amount || !category) {
            alert('Amount and Category enter pannunga!');
            return;
        }

        const { error } = await db
            .from('transactions')
            .insert([{ type, amount, category }]);

        if (error) {
            alert('Database-la save aagalai: ' + error.message);
        } else {
            document.getElementById('amount').value = '';
            document.getElementById('category').value = '';
            fetchTransactions(); // Refresh Data from Database
        }
    }

    // Update UI Elements
    function updateUI(transactions) {
        const list = document.getElementById('transaction-list');
        list.innerHTML = '';

        if (transactions.length === 0) {
            list.innerHTML = '<p style="color:#888;">No transactions found.</p>';
            return;
        }

        let totalIncome = 0;
        let totalExpense = 0;

        transactions.forEach(t => {
            const val = parseFloat(t.amount);
            if (t.type === 'income') totalIncome += val;
            if (t.type === 'expense') totalExpense += val;

            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
                <div class="item-details">
                    <strong>${t.category}</strong>
                    <span>${t.type.toUpperCase()}</span>
                </div>
                <span class="${t.type}">
                    ${t.type === 'income' ? '+' : '-'}₹${val}
                </span>
            `;
            list.appendChild(item);
        });

        document.getElementById('income').innerText = `₹${totalIncome}`;
        document.getElementById('expense').innerText = `₹${totalExpense}`;
        document.getElementById('balance').innerText = `₹${totalIncome - totalExpense}`;
    }

    // Initial Fetch on Load
    fetchTransactions();
</script>

</body>
</html>
