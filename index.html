<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense & Budget Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; padding: 20px 10px; color: #f8fafc; }
        .container { max-width: 520px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 24px; text-shadow: 0 0 10px rgba(56,189,248,0.3); }
        
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37); }
        h3 { font-size: 16px; margin-bottom: 14px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; }
        
        label { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; display: block; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; outline: none; background: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.4); }
        
        button { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-weight: bold; border: none; cursor: pointer; transition: all 0.2s; }
        button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-edit { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        /* Category Grid Cards */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .budget-card { background: #1e293b; border: 1px solid #334155; padding: 12px; border-radius: 12px; text-align: center; }
        .budget-card strong { font-size: 14px; color: #f8fafc; display: block; }
        .budget-card span { font-size: 11px; color: #64748b; }
        .budget-status { font-weight: bold; font-size: 16px; margin: 6px 0; }
        .positive { color: #4ade80; }
        .negative { color: #f87171; }
        .cat-actions { display: flex; gap: 5px; margin-top: 6px; }
        .cat-actions button { padding: 4px; font-size: 10px; margin: 0; }

        /* Filter Controls */
        .filter-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        /* Transaction Item */
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #334155; }
        .list-item span { font-size: 11px; color: #64748b; }
        .amount-credit { color: #4ade80; font-weight: bold; }
        .amount-debit { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Budget & Expense Tracker</h2>
    
    <!-- Month Selection -->
    <div class="card">
        <label>Select Month History:</label>
        <select id="month-filter" onchange="loadDashboard()"></select>
    </div>

    <!-- Category Allowances -->
    <div class="card">
        <h3>Category Allowances</h3>
        <div id="budget-list" class="category-grid">Loading Budgets...</div>
        
        <h4 style="font-size:13px; color:#94a3b8; margin: 10px 0 8px;">Add New Allowance Category</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="new-cat-name" placeholder="Name (e.g. Theatre)">
            <input type="number" id="new-cat-limit" placeholder="Monthly Limit">
        </div>
        <button onclick="addCategory()">+ Add Category</button>
    </div>

    <!-- Add Entry Form -->
    <div class="card">
        <h3>Add Entry</h3>
        <label>Transaction Type</label>
        <select id="type" onchange="toggleCategoryInput()">
            <option value="expense">Expense (Debit)</option>
            <option value="income">Income (Credit)</option>
        </select>
        
        <label>Category / Description</label>
        <div id="category-input-container">
            <!-- Dynamic Category Selection / Direct Text -->
        </div>

        <label>Amount</label>
        <input type="number" id="amount" placeholder="Amount (e.g. 500)">
        <button onclick="addTransaction()">Save Transaction</button>
    </div>

    <!-- History & Filters -->
    <div class="card">
        <h3>History Filter</h3>
        <div class="filter-group">
            <div>
                <label>Type Filter</label>
                <select id="filter-type" onchange="renderHistory()">
                    <option value="all">All Transactions</option>
                    <option value="income">Credit (Income) Only</option>
                    <option value="expense">Debit (Expense) Only</option>
                </select>
            </div>
            <div>
                <label>Category Filter</label>
                <select id="filter-category" onchange="renderHistory()">
                    <!-- Populated dynamically -->
                </select>
            </div>
        </div>
        <div id="transaction-list">Loading...</div>
    </div>
</div>

<script>
    // ⚠️ PASTE YOUR SUPABASE DETAILS HERE
    const SUPABASE_URL = 'https://rjinxqbqiypcimtthcbv.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_cOp1rCjsTMyShJRMitbsng_jkxpmJ2m'; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let categories = [];
    let currentTransactions = [];

    function initMonthDropdown() {
        const select = document.getElementById('month-filter');
        const currentDate = new Date();
        for (let i = 0; i < 12; i++) {
            const date = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
            const monthVal = date.toISOString().slice(0, 7);
            const monthText = date.toLocaleString('default', { month: 'long', year: 'numeric' });
            const opt = document.createElement('option');
            opt.value = monthVal; opt.innerText = monthText;
            select.appendChild(opt);
        }
    }

    async function loadCategories() {
        const { data } = await db.from('category_budgets').select('*').eq('is_active', true);
        categories = data || [];
        toggleCategoryInput();
        
        // Populate History Category Filter
        const catFilter = document.getElementById('filter-category');
        catFilter.innerHTML = '<option value="all">All Categories</option>';
        categories.forEach(c => {
            catFilter.innerHTML += `<option value="${c.category_name}">${c.category_name}</option>`;
        });
    }

    function toggleCategoryInput() {
        const type = document.getElementById('type').value;
        const container = document.getElementById('category-input-container');
        
        if (type === 'expense') {
            let options = categories.map(c => `<option value="${c.category_name}">${c.category_name}</option>`).join('');
            container.innerHTML = `<select id="category-value">${options}</select>`;
        } else {
            container.innerHTML = `<input type="text" id="category-value" placeholder="Type Income Source (e.g. Salary, Bonus)">`;
        }
    }

    async function addCategory() {
        const name = document.getElementById('new-cat-name').value;
        const limit = parseFloat(document.getElementById('new-cat-limit').value);
        if(!name || !limit) return alert("Category Name and Limit Enter Pannunga!");

        await db.from('category_budgets').upsert([{ category_name: name, monthly_limit: limit, is_active: true }], { onConflict: 'category_name' });
        document.getElementById('new-cat-name').value = '';
        document.getElementById('new-cat-limit').value = '';
        await loadCategories();
        loadDashboard();
    }

    async function updateLimit(catName, currentLimit) {
        const newLimit = prompt(`Update Monthly Budget Limit for ${catName}:`, currentLimit);
        if (newLimit !== null && !isNaN(newLimit) && confirm(`Confirm to change limit for ${catName} to ₹${newLimit}?`)) {
            await db.from('category_budgets').update({ monthly_limit: parseFloat(newLimit) }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function removeCategory(catName) {
        if(confirm(`Remove "${catName}" category? (Previous transaction data will stay safe in Database)`)) {
            await db.from('category_budgets').update({ is_active: false }).eq('category_name', catName);
            await loadCategories();
            loadDashboard();
        }
    }

    async function loadDashboard() {
        const selectedMonth = document.getElementById('month-filter').value;
        const startDate = `${selectedMonth}-01T00:00:00.000Z`;
        const endDate = new Date(selectedMonth.split('-')[0], selectedMonth.split('-')[1], 0, 23, 59, 59).toISOString();

        const { data: transactions } = await db.from('transactions').select('*').gte('created_at', startDate).lte('created_at', endDate);
        currentTransactions = transactions || [];

        // Category Budget Calculations
        const budgetContainer = document.getElementById('budget-list');
        budgetContainer.innerHTML = '';

        categories.forEach(c => {
            const catExpenses = currentTransactions
                .filter(t => t.category === c.category_name && t.type === 'expense')
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            const remBalance = c.monthly_limit - catExpenses;
            const statusClass = remBalance >= 0 ? 'positive' : 'negative';

            budgetContainer.innerHTML += `
                <div class="budget-card">
                    <strong>${c.category_name}</strong>
                    <span>Limit: ₹${c.monthly_limit}</span>
                    <div class="budget-status ${statusClass}">₹${remBalance}</div>
                    <span>Spent: ₹${catExpenses}</span>
                    <div class="cat-actions">
                        <button class="btn-edit" onclick="updateLimit('${c.category_name}', ${c.monthly_limit})">Edit</button>
                        <button class="btn-danger" onclick="removeCategory('${c.category_name}')">Remove</button>
                    </div>
                </div>
            `;
        });

        renderHistory();
    }

    function renderHistory() {
        const typeFilter = document.getElementById('filter-type').value;
        const catFilter = document.getElementById('filter-category').value;
        const listContainer = document.getElementById('transaction-list');
        
        let filtered = currentTransactions.filter(t => {
            let matchType = typeFilter === 'all' || t.type === typeFilter;
            let matchCat = catFilter === 'all' || t.category === catFilter;
            return matchType && matchCat;
        });

        listContainer.innerHTML = '';
        if (filtered.length === 0) {
            listContainer.innerHTML = '<p style="color:#64748b; text-align:center; padding:10px;">No matching transactions found.</p>';
            return;
        }

        filtered.forEach(t => {
            const isCredit = t.type === 'income';
            listContainer.innerHTML += `
                <div class="list-item">
                    <div>
                        <strong>${t.category}</strong><br>
                        <span>${new Date(t.created_at).toLocaleDateString()}</span>
                    </div>
                    <strong class="${isCredit ? 'amount-credit' : 'amount-debit'}">
                        ${isCredit ? '+' : '-'}₹${t.amount}
                    </strong>
                </div>
            `;
        });
    }

    async function addTransaction() {
        const type = document.getElementById('type').value;
        const categoryInput = document.getElementById('category-value');
        const category = categoryInput ? categoryInput.value : 'General';
        const amount = parseFloat(document.getElementById('amount').value);

        if(!amount || !category) return alert('Enter valid Category and Amount!');

        await db.from('transactions').insert([{ type, category, amount }]);
        document.getElementById('amount').value = '';
        if(type === 'income') categoryInput.value = '';
        loadDashboard();
    }

    initMonthDropdown();
    loadCategories().then(() => loadDashboard());
</script>

</body>
</html>
