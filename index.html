<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Modern UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Visual Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>💰 Expense Tracker</h1>
            <button id="themeToggle" class="btn-theme" title="Toggle Dark/Light Mode">🌙</button>
        </header>

        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card income">
                <span>Total Income</span>
                <h2 id="totalIncome">₹0.00</h2>
            </div>
            <div class="card expense">
                <span>Total Expense</span>
                <h2 id="totalExpense">₹0.00</h2>
            </div>
            <div class="card balance">
                <span>Net Balance</span>
                <h2 id="netBalance">₹0.00</h2>
            </div>
        </section>

        <!-- Add Transaction Form -->
        <section class="card form-section">
            <h3>➕ Add New Transaction</h3>
            <form id="transactionForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="desc">Description</label>
                        <input type="text" id="desc" placeholder="e.g., Dinner, Petrol, Salary" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>

                    <div class="input-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="expense">Expense 🔴</option>
                            <option value="income">Income 🟢</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">🍔 Food</option>
                            <option value="Travel">🚗 Travel</option>
                            <option value="Bills">💡 Bills</option>
                            <option value="Shopping">🛍️ Shopping</option>
                            <option value="Salary">💼 Salary</option>
                            <option value="Udhaar">🤝 Udhaar / Debt</option>
                            <option value="Others">📦 Others</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="tag">Need vs Want</label>
                        <select id="tag">
                            <option value="Need">📌 Need (அவசியம்)</option>
                            <option value="Want">🎯 Want (ஆசை)</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </section>

        <!-- Analytics & Visualization -->
        <section class="card chart-section">
            <h3>📊 Category Analytics</h3>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
        </section>

        <!-- Transactions History & Filters -->
        <section class="card history-section">
            <div class="history-header">
                <h3>📜 Recent Transactions</h3>
                <div class="actions">
                    <input type="text" id="searchInput" placeholder="Search entries..." class="search-box">
                    <button id="exportBtn" class="btn-export">📥 Export CSV</button>
                </div>
            </div>

            <ul id="transactionList" class="transaction-list">
                <!-- Dynamic Items Inserted via JS -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
